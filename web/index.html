<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            height: 100vh;
            overflow: hidden;
            color: #e0e0e0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #3e3e42;
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            font-size: 14px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .search-box:focus {
            outline: none;
            border-color: #007acc;
        }

        .categories {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .category {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cccccc;
        }

        .category:hover {
            background: #2a2d2e;
        }

        .category.active {
            background: #094771;
            color: #9cdcfe;
            font-weight: 500;
        }

        .category-count {
            font-size: 12px;
            color: #858585;
            background: #3e3e42;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Notes List */
        .notes-list {
            width: 320px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .notes-header {
            padding: 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .btn-new {
            padding: 6px 12px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-new:hover {
            background: #1177bb;
        }

        .notes {
            flex: 1;
            overflow-y: auto;
        }

        .note-item {
            padding: 16px 20px;
            border-bottom: 1px solid #3e3e42;
            cursor: pointer;
        }

        .note-item:hover {
            background: #2a2d2e;
        }

        .note-item.active {
            background: #094771;
            border-left: 3px solid #0e639c;
        }

        .note-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #e0e0e0;
        }

        .note-tags {
            font-size: 12px;
            color: #858585;
        }

        .note-tag {
            display: inline-block;
            background: #3e3e42;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 4px;
            color: #cccccc;
        }

        /* Editor */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .editor-header {
            padding: 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            flex: 1;
            font-size: 24px;
            font-weight: 600;
            border: none;
            outline: none;
            padding: 8px;
            border-radius: 4px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .editor-title:focus {
            background: #2a2d2e;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background: #252526;
            color: #e0e0e0;
        }

        .btn:hover {
            background: #2a2d2e;
        }

        .btn-primary {
            background: #0e639c;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #1177bb;
        }

        .btn-danger {
            background: #f14c4c;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background: #d13838;
        }

        .editor-metadata {
            padding: 0 20px 12px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #3e3e42;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .metadata-label {
            color: #858585;
            font-weight: 500;
        }

        .metadata-value {
            padding: 4px 8px;
            background: #252526;
            border-radius: 4px;
            color: #cccccc;
        }

        .editor-tags {
            flex: 1;
        }

        .tags-input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            font-size: 13px;
            background: #252526;
            color: #e0e0e0;
        }

        .tags-input:focus {
            outline: none;
            border-color: #007acc;
        }

        .editor-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .editor-textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6e6e6e;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            color: #858585;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #858585;
        }

        .error {
            background: #5a1d1d;
            color: #f48771;
            padding: 12px;
            border-radius: 6px;
            margin: 12px;
            border: 1px solid #be1100;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #252526;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #3e3e42;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e0e0e0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #cccccc;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            font-size: 14px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .form-input:focus {
            outline: none;
            border-color: #007acc;
        }

        .form-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            font-size: 14px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .form-select:focus {
            outline: none;
            border-color: #007acc;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="app" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h1>📚 Knowledge Base</h1>
                    <button class="btn" id="btnLogout" style="padding: 4px 12px; font-size: 12px;">Logout</button>
                </div>
                <input type="text" class="search-box" id="searchBox" placeholder="Search notes...">
            </div>
            <div class="categories" id="categoriesList">
                <div class="loading">Loading categories...</div>
            </div>
        </div>

        <!-- Notes List -->
        <div class="notes-list">
            <div class="notes-header">
                <h2 id="notesListTitle">All Notes</h2>
                <button class="btn-new" id="btnNewNote">+ New</button>
            </div>
            <div class="notes" id="notesList">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-text">Select a category</div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor">
            <div id="editorEmpty" class="empty-state">
                <div class="empty-state-icon">✏️</div>
                <div class="empty-state-text">Select a note to edit</div>
            </div>
            <div id="editorContent" style="display: none; flex: 1; display: flex; flex-direction: column;">
                <div class="editor-header">
                    <input type="text" class="editor-title" id="noteTitle" placeholder="Note title...">
                    <div class="editor-actions">
                        <button class="btn btn-danger" id="btnDelete">Delete</button>
                        <button class="btn btn-primary" id="btnSave">Save</button>
                    </div>
                </div>
                <div class="editor-metadata">
                    <div class="metadata-item">
                        <span class="metadata-label">Category:</span>
                        <span class="metadata-value" id="noteCategory"></span>
                    </div>
                    <div class="metadata-item editor-tags">
                        <span class="metadata-label">Tags:</span>
                        <input type="text" class="tags-input" id="noteTags" placeholder="comma, separated, tags">
                    </div>
                </div>
                <div class="editor-content">
                    <textarea class="editor-textarea" id="noteContent" placeholder="Start writing..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Authentication Modal -->
    <div class="modal show" id="authModal">
        <div class="modal-content">
            <!-- Login Form -->
            <div id="loginForm">
                <div class="modal-header">Login to Knowledge Base</div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter password">
                </div>
                <div class="modal-actions">
                    <button class="btn" id="btnShowSignup">Create Account</button>
                    <button class="btn btn-primary" id="btnLogin">Login</button>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" style="display: none;">
                <div class="modal-header">Create Account</div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password (min 8 characters)</label>
                    <input type="password" class="form-input" id="signupPassword" placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name (optional)</label>
                    <input type="text" class="form-input" id="signupName" placeholder="Your name">
                </div>
                <div class="modal-actions">
                    <button class="btn" id="btnShowLogin">Back to Login</button>
                    <button class="btn btn-primary" id="btnSignup">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Note Modal -->
    <div class="modal" id="newNoteModal">
        <div class="modal-content">
            <div class="modal-header">Create New Note</div>
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-input" id="newNoteTitle" placeholder="Enter note title">
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select" id="newNoteCategory">
                    <option value="">Select a category...</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tags (optional)</label>
                <input type="text" class="form-input" id="newNoteTags" placeholder="comma, separated, tags">
            </div>
            <div class="modal-actions">
                <button class="btn" id="btnCancelNew">Cancel</button>
                <button class="btn btn-primary" id="btnCreateNote">Create</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
