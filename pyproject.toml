[project]
name = "knowledge-base-mcp"
version = "0.1.0"
description = "MCP server for managing a personal markdown-based knowledge base"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
knowledge-base-server = "knowledge_base_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
